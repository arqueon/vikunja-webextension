<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vikunja Companion</title>
  <link rel="stylesheet" href="../styles/common.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <img
      id="logo"
      src="../icons/icon-32.png"
      alt="Vikunja logo"
      width="28"
      height="28"
      role="button"
      tabindex="0"
      title="Open Vikunja"
      aria-label="Open Vikunja"
      data-i18n-title="logoTitle"
      data-i18n-aria-label="logoAriaLabel"
    />
    <input
      type="search"
      id="search"
      placeholder="Search tasks…"
      autocomplete="off"
      spellcheck="false"
      aria-label="Search tasks"
      data-i18n-placeholder="searchPlaceholder"
      data-i18n-aria-label="searchAriaLabel"
    />
    <div class="sort-wrap">
      <button id="sort-btn" class="icon-btn" title="Sort tasks" aria-label="Sort tasks" aria-haspopup="menu" aria-expanded="false" data-i18n-title="sortTasksTitle" data-i18n-aria-label="sortTasksAriaLabel">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h7"></path>
          <path d="M3 12h7"></path>
          <path d="M3 18h7"></path>
          <path d="M17 9v9"></path>
          <path d="M14 15l3 3 3-3"></path>
        </svg>
      </button>
      <ul id="sort-menu" class="sort-menu" hidden></ul>
    </div>
    <button id="add-site" class="icon-btn" title="Add current page as task" aria-label="Add current page as task" data-i18n-title="addSiteTitle" data-i18n-aria-label="addSiteAriaLabel">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
    <button id="open-settings" class="icon-btn" title="Settings" aria-label="Open settings" data-i18n-title="settingsTitle" data-i18n-aria-label="settingsAriaLabel">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <section id="config-prompt" class="view" hidden>
    <p class="empty" data-i18n="notConfigured">Vikunja is not configured yet.</p>
    <button id="grant-access" class="primary" hidden data-i18n="grantAccess">Grant access</button>
    <button id="go-settings" class="primary" data-i18n="openSettings">Open settings</button>
  </section>

  <section id="loading" class="view" hidden>
    <p class="empty" data-i18n="loadingTasks">Loading tasks…</p>
  </section>

  <section id="list" class="view" hidden>
    <div id="view-switcher" class="view-switcher" hidden></div>
    <div class="preset-filter-bar">
      <div class="preset-chips">
        <button type="button" class="preset-chip active" data-preset="all">All</button>
        <button type="button" class="preset-chip" data-preset="due">Today + Overdue</button>
        <button type="button" class="preset-chip" data-preset="favorites">Favorites</button>
      </div>
      <button type="button" id="toggle-completed" class="icon-toggle-btn" title="Show completed tasks" aria-pressed="false">
        <span class="toggle-icon">👁</span>
        <span class="toggle-label">Done</span>
      </button>
    </div>
    <ul id="task-list" class="task-list"></ul>
    <p id="task-empty" class="empty" hidden data-i18n="noTasks">No tasks here yet.</p>
    <form id="quick-add" class="quick-add">
      <textarea
        id="quick-title"
        name="title"
        rows="1"
        placeholder="Add a task…"
        maxlength="500"
        autocomplete="off"
        spellcheck="false"
        aria-label="Add a task"
        data-i18n-placeholder="quickAddPlaceholder"
        data-i18n-aria-label="quickAddAriaLabel"
      ></textarea>
      <div id="quick-chips" class="quick-chips"></div>
      <button type="submit" id="quick-add-btn" class="primary" data-i18n="addButton">Add</button>
      <div id="toast" class="toast" hidden></div>
    </form>
    <span id="quick-error" class="error" hidden></span>
  </section>

  <section id="capture" class="view" hidden>
    <div class="capture-header-row">
      <h2 class="capture-title" data-i18n="captureTitle">Add task to Vikunja</h2>
      <button type="button" id="capture-direct-add" class="secondary" title="Save directly with current tab info and default project" data-i18n-title="quickDirectSaveTitle">⚡ Direct Save</button>
    </div>
    <form id="capture-form" class="capture-form">
      <label class="field">
        <span class="label" data-i18n="fieldTitle">Title</span>
        <input type="text" id="capture-title" name="title" maxlength="500" autocomplete="off" spellcheck="false" required />
      </label>
      <label class="field">
        <span class="label" data-i18n="fieldProject">Project</span>
        <select id="capture-project"></select>
      </label>
      <div class="field-row">
        <label class="field field-half">
          <span class="label" data-i18n="fieldPriority">Priority</span>
          <select id="capture-priority">
            <option value="0">No priority</option>
            <option value="1">Low (1)</option>
            <option value="2">Medium (2)</option>
            <option value="3">High (3)</option>
            <option value="4">Urgent (4)</option>
            <option value="5">Do now (5)</option>
          </select>
        </label>
        <label class="field field-half">
          <span class="label" data-i18n="fieldDueDate">Due date</span>
          <input type="datetime-local" id="capture-due" name="dueDate" />
        </label>
      </div>
      <div class="date-presets-row">
        <button type="button" class="preset-btn" data-preset="today">Today</button>
        <button type="button" class="preset-btn" data-preset="tomorrow">Tomorrow</button>
        <button type="button" class="preset-btn" data-preset="weekend">Weekend</button>
        <button type="button" class="preset-btn" data-preset="nextweek">Next week</button>
        <button type="button" class="preset-btn" data-preset="clear">No date</button>
      </div>
      <label class="field">
        <span class="label" data-i18n="fieldLabels">Labels (comma-separated or select below)</span>
        <input type="text" id="capture-labels-input" placeholder="e.g. readlater, research" autocomplete="off" />
        <div id="capture-labels-chips" class="labels-cloud"></div>
      </label>
      <label class="field">
        <span class="label" data-i18n="fieldDescription">Description (optional)</span>
        <textarea id="capture-description" name="description" rows="3" spellcheck="false"></textarea>
      </label>
      <div class="actions">
        <span id="capture-error" class="error" hidden></span>
        <button type="button" id="capture-cancel" class="secondary" data-i18n="cancelButton">Cancel</button>
        <button type="submit" id="capture-add" class="primary" data-i18n="addTaskButton">Add task</button>
      </div>
    </form>
  </section>

  <script src="../lib/i18n.js"></script>
  <script src="../lib/vikunja.js"></script>
  <script src="../lib/quick-add.js"></script>
  <script src="../lib/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
